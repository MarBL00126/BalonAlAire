<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Balón Al Aire</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<main class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-title">
                <img src="/assets/images/logo.png" alt="Balón Al Aire" class="login-logo">
                <p>Recuperar contraseña</p>
            </div>

            <div id="forgot-message" class="admin-message"></div>

            <form class="login-form" id="forgot-form">

                <div class="form-group">
                    <label for="identifier">Usuario o correo electrónico</label>
                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        required
                        autocomplete="username"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="forgot-submit">
                    Enviar email
                </button>

            </form>

            <p style="margin-top: 16px; text-align: center; font-size: 13px;">
                <a href="/admin/login">Volver al login</a>
            </p>

        </div>

    </div>

</main>

<script>
(function () {
    "use strict";

    const form = document.getElementById("forgot-form");
    const message = document.getElementById("forgot-message");
    const submit = document.getElementById("forgot-submit");

    function showMsg(text, type) {
        message.textContent = text;
        message.className = "admin-message " + type;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        submit.disabled = true;
        submit.textContent = "Enviando...";

        try {
            const response = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    identifier: document.getElementById("identifier").value.trim()
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || data.error || `Error ${response.status}`);
            }

            showMsg(data.message, "success");
        } catch (error) {
            showMsg(error.message, "error");
        } finally {
            submit.disabled = false;
            submit.textContent = "Enviar email";
        }
    });
})();
</script>

</body>
</html>
