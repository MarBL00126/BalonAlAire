<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — Balón Al Aire</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<main class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-title">
                <img src="/assets/images/logo.png" alt="Balón Al Aire" class="login-logo">
                <p>Nueva contraseña</p>
            </div>

            <div id="reset-message" class="admin-message"></div>

            <form class="login-form" id="reset-form">

                <div class="form-group">
                    <label for="new-password">Nueva contraseña</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="password-confirm"
                        name="password-confirm"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="reset-submit">
                    Guardar contraseña
                </button>

            </form>

            <p style="margin-top: 16px; text-align: center; font-size: 13px;">
                <a href="/admin/login">Volver al login</a>
            </p>

        </div>

    </div>

</main>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const form = document.getElementById("reset-form");
    const message = document.getElementById("reset-message");
    const submit = document.getElementById("reset-submit");

    function showMsg(text, type) {
        message.textContent = text;
        message.className = "admin-message " + type;
    }

    if (!token) {
        form.style.display = "none";
        showMsg("El enlace de recuperación no es válido.", "error");
        return;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const newPassword = document.getElementById("new-password").value;
        const confirm = document.getElementById("password-confirm").value;

        if (newPassword !== confirm) {
            showMsg("Las contraseñas no coinciden.", "error");
            return;
        }

        submit.disabled = true;
        submit.textContent = "Guardando...";

        try {
            const response = await fetch("/api/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, newPassword })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || data.error || `Error ${response.status}`);
            }

            showMsg("Contraseña actualizada. Redirigiendo al login...", "success");

            setTimeout(() => {
                window.location.href = "/admin/login";
            }, 1800);
        } catch (error) {
            showMsg(error.message, "error");
            submit.disabled = false;
            submit.textContent = "Guardar contraseña";
        }
    });
})();
</script>

</body>
</html>
