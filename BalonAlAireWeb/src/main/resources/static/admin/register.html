<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario — Balón Al Aire</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<main class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-title">
                <img src="/assets/images/logo.png" alt="Balón Al Aire" class="login-logo">
                <p>Registrar nuevo administrador</p>
            </div>

            <div id="register-message" class="admin-message"></div>

            <form class="login-form" id="register-form">

                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        minlength="3"
                        maxlength="50"
                        autocomplete="username"
                        placeholder="mínimo 3 caracteres"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="opcional"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="mínimo 6 caracteres"
                    >
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="password-confirm"
                        name="password-confirm"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="register-submit">
                    Registrar
                </button>

            </form>

            <p style="margin-top: 16px; text-align: center; font-size: 13px;">
                <a href="/admin/login">← Volver al login</a>
            </p>

            <p class="login-back-link">
                <a href="/">← Volver a la página principal</a>
            </p>

        </div>

    </div>

</main>

<script>
(function () {
    "use strict";

    const form    = document.getElementById("register-form");
    const message = document.getElementById("register-message");
    const submit  = document.getElementById("register-submit");

    function showMsg(text, type) {
        message.textContent = text;
        message.className   = "admin-message " + type;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("password-confirm").value;

        if (password !== confirm) {
            showMsg("Las contraseñas no coinciden.", "error");
            return;
        }

        submit.disabled    = true;
        submit.textContent = "Registrando...";

        try {
            const res = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, email })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.message || data.error || `Error ${res.status}`);
            }

            showMsg("Usuario registrado. Redirigiendo al login...", "success");

            setTimeout(() => {
                window.location.href = "/admin/login";
            }, 2000);

        } catch (err) {
            showMsg(err.message, "error");
            submit.disabled    = false;
            submit.textContent = "Registrar";
        }
    });
})();
</script>

</body>
</html>
